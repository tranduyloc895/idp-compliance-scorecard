# CI — catalog: push main thay đổi idp-microservices/src/catalog/** → build/scan/push ECR → ghi tag GitOps.
name: "CI — catalog"

on:
  push:
    branches: [main]
    paths:
      - "idp-microservices/src/catalog/**"
      - ".github/workflows/ci-catalog.yml"
      - ".github/workflows/_build-push.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/_build-push.yml
    with:
      service: catalog
      context: idp-microservices/src/catalog
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
