# CI — compliance-engine: push main thay đổi compliance-engine/** → build/scan/push ECR → ghi tag GitOps.
name: "CI — compliance-engine"

on:
  push:
    branches: [main]
    paths:
      - "compliance-engine/**"
      - ".github/workflows/ci-compliance-engine.yml"
      - ".github/workflows/_build-push.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/_build-push.yml
    with:
      service: compliance-engine
      context: compliance-engine
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
