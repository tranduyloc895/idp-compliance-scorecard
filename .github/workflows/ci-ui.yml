# CI — ui: push main thay đổi idp-microservices/src/ui/** → build/scan/push ECR → ghi tag GitOps.
name: "CI — ui"

on:
  push:
    branches: [main]
    paths:
      - "idp-microservices/src/ui/**"
      - ".github/workflows/ci-ui.yml"
      - ".github/workflows/_build-push.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/_build-push.yml
    with:
      service: ui
      context: idp-microservices/src/ui
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
