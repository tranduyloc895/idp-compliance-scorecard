    argocd/app-name: ui
    # TechDocs (future)
    backstage.io/techdocs-ref: dir:.
  tags:
    - java
    - spring-boot
    - frontend
  links:
    - url: https://github.com/tranduyloc895/idp-microservices/tree/main/src/ui
      title: Source Code
      icon: github
    - url: https://github.com/tranduyloc895/idp-microservices/actions/workflows/ci-ui.yml
      title: CI Pipeline
      icon: github
spec:
