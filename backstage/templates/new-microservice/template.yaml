apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-microservice
  title: Create a New Microservice
  description: "Tạo repo GitHub mới với CI pipeline (OIDC + ECR), Helm values, và ArgoCD Application. Template này implement toàn bộ Golden Path cho Retail Store platform."
  tags:
    - recommended
    - microservice
    - github-actions
    - argocd
spec:
  owner: platform-team
  type: service

  # ─── Parameters ──────────────────────────────────────────────────────────
  parameters:
    - title: Service Information
      required:
        - serviceName
        - language
        - owner
      properties:
        serviceName:
          title: Service Name
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          description: "Lowercase, hyphens allowed (e.g., payment-service). Will be used as the GitHub repo name."
          ui:autofocus: true

        language:
          title: Language / Framework
          type: string
          enum:
            - java-spring
            - go
            - nestjs
          enumNames:
            - "Java (Spring Boot)"
            - "Go"
            - "NestJS (TypeScript)"

        description:
          title: Description
          type: string
          description: "Short description of what this service does."

        owner:
          title: Owner Team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Repository Settings
      properties:
        repoVisibility:
          title: Repository Visibility
          type: string
          enum:
            - public
            - private
          default: public
          description: "GitHub repository visibility. Use private for sensitive services."

  # ─── Steps ───────────────────────────────────────────────────────────────
  steps:
    # Step 1: Generate source files from skeleton
    - id: fetch-skeleton
      name: Fetch Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          serviceName: ${{ parameters.serviceName }}
          language: ${{ parameters.language }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description | default("") }}
          ecrRegistry: "736508008585.dkr.ecr.us-east-1.amazonaws.com"
          ecrRepo: "retail-store/${{ parameters.serviceName }}"
          gitopsRepo: "tranduyloc895/idp-gitops"
          githubOrg: "tranduyloc895"

    # Step 2: Create new GitHub repository
    - id: publish
      name: Create GitHub Repository
      action: publish:github
      input:
        allowedHosts:
          - github.com
        repoUrl: "github.com?owner=tranduyloc895&repo=${{ parameters.serviceName }}"
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: ${{ parameters.repoVisibility }}
        gitCommitMessage: "feat: initial scaffold via Backstage Golden Path"
        protectDefaultBranch: true
        requireCodeOwnerReviews: false
        requiredStatusCheckContexts: []

    # Step 3: Open PR in idp-gitops to add Helm values + ArgoCD Application
    - id: gitops-pr
      name: Add ArgoCD Application to GitOps
      action: publish:github:pull-request
      input:
        repoUrl: "github.com?owner=tranduyloc895&repo=idp-gitops"
        title: "feat: onboard ${{ parameters.serviceName }}"
        branchName: "onboard/${{ parameters.serviceName }}"
        description: |
          ## New Service: `${{ parameters.serviceName }}`

          Auto-generated by Backstage Golden Path Template.

          ### What this PR adds
          - `apps/${{ parameters.serviceName }}/values.yaml` — Helm chart values
          - `argocd/${{ parameters.serviceName }}-application.yaml` — ArgoCD Application manifest

          ### Next steps after merge
          1. Update IAM OIDC trust policy in `infrastructure/04-oidc/main.tf` to allow the new repo
          2. Create ECR repository in `infrastructure/03-ecr/`
          3. Trigger first CI run by pushing a commit to `main` in the new repo

          > Scaffold created by: @${{ user.entity.metadata.name }}
        update: false

    # Step 4: Register the new service in the Backstage Catalog
    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # ─── Outputs ─────────────────────────────────────────────────────────────
  output:
    links:
      - title: "📦 New Repository: ${{ parameters.serviceName }}"
        url: ${{ steps.publish.output.remoteUrl }}
        icon: github
      - title: "🔀 GitOps Pull Request"
        url: ${{ steps['gitops-pr'].output.remoteUrl }}
        icon: github
      - title: "📋 Open in Catalog"
        entityRef: ${{ steps.register.output.entityRef }}
        icon: catalog
    text:
      - title: "⚠️ Manual steps required"
        content: |
          After the GitOps PR is merged:
          1. Add `tranduyloc895/${{ parameters.serviceName }}` to OIDC trust policy in `infrastructure/04-oidc/main.tf`
          2. Add ECR repo `retail-store/${{ parameters.serviceName }}` in `infrastructure/03-ecr/`
          3. Run `terraform apply` in both modules
