[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "compliance-engine"
version = "1.0.0"
description = "Continuous Compliance Scorecard Framework for Kubernetes"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Cache
    "redis>=5.0",
    # Kubernetes client
    "kubernetes-asyncio>=31.0",
    # AI
    "google-genai>=1.0",
    # Data validation
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # HTTP client (TestClient + health checks)
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",             # FastAPI TestClient
    "fakeredis[aioredis]>=2.25",  # Mock Redis in tests
    "ruff>=0.6",               # Linter + formatter
    "mypy>=1.11",              # Type checker
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "-v",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (ruff format handles it)

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
