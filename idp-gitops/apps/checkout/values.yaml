name: checkout

image:
  # registry lấy từ apps/image-registry.yaml; tag do CI ghi (MANAGED BY CI)
  repository: retail-store/checkout
  tag: "not-built"

resources:
  requests:
    cpu: 128m
    memory: 256Mi
  limits:
    cpu: 256m
    memory: 512Mi

probes:
  readiness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 45
    periodSeconds: 15

# Kết nối Redis dùng chung; checkout gọi orders để tạo đơn (qua Service ClusterIP port 80).
env:
  - {name: RETAIL_CHECKOUT_PERSISTENCE_PROVIDER, value: "redis"}
  - {name: RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL, value: "redis://checkout-redis:6379"}
  - {name: RETAIL_CHECKOUT_ENDPOINTS_ORDERS, value: "http://orders:80"}
