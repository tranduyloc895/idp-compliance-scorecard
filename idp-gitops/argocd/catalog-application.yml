apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-store-catalog
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/tranduyloc895/idp-compliance-scorecard.git
      targetRevision: main
      path: idp-gitops/charts/microservice
      helm:
        releaseName: catalog
        valueFiles:
          - $values/idp-gitops/apps/image-registry.yaml
          - $values/idp-gitops/apps/catalog/values.yaml
    - repoURL: https://github.com/tranduyloc895/idp-compliance-scorecard.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
