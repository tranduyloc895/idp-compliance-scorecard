apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: compliance-engine
  namespace: argocd
  labels:
    app.kubernetes.io/name: compliance-engine
    app.kubernetes.io/part-of: idp-platform
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/idp-platform
    targetRevision: HEAD
    path: idp-gitops/compliance/compliance-engine
  destination:
    server: https://kubernetes.default.svc
    namespace: compliance
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
