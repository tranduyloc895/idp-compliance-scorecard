# Kyverno engine (CRD + controllers). Policies tách ra Application riêng ở wave sau
# để CRD ClusterPolicy có trước khi apply policy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: idp-platform
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.2.6
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/idp-gitops/platform/kyverno/values.yaml
    - repoURL: https://github.com/tranduyloc895/idp-compliance-scorecard.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # CRD lớn của Kyverno
    retry:
      limit: 5
      backoff: { duration: 30s, maxDuration: 5m, factor: 2 }
