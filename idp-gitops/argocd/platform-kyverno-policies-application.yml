# 8 ClusterPolicy (Audit mode) — sinh PolicyReport cho Compliance Engine.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: idp-platform
spec:
  project: default
  source:
    repoURL: https://github.com/tranduyloc895/idp-compliance-scorecard.git
    targetRevision: main
    path: idp-gitops/platform/kyverno/policies
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 30s, maxDuration: 5m, factor: 2 }
