apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-namespace
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tranduyloc895/idp-compliance-scorecard.git
    targetRevision: main
    path: idp-gitops/platform/monitoring
    directory:
      include: "namespace.yml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=false"]
