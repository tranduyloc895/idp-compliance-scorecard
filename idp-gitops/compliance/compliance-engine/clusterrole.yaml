---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compliance-engine
  namespace: compliance
  labels:
    app.kubernetes.io/name: compliance-engine
  annotations:
    # IRSA annotation for AWS ECR pull (fill in actual Role ARN)
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/compliance-engine-role
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compliance-engine
  labels:
    app.kubernetes.io/name: compliance-engine
rules:
  # Read PolicyReports from Kyverno
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["get", "list", "watch"]
  # Read VulnerabilityReports from Trivy
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports", "configauditreports"]
    verbs: ["get", "list", "watch"]
  # Read ConfigMap (kube-bench results)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Read namespaces and nodes (for context)
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: compliance-engine
  labels:
    app.kubernetes.io/name: compliance-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: compliance-engine
subjects:
  - kind: ServiceAccount
    name: compliance-engine
    namespace: compliance
