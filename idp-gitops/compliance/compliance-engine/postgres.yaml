# PostgreSQL riêng cho Compliance Engine (audit #18) — trước đây Deployment trỏ tới
# postgresql.backstage.svc nhưng không có service đó trên EKS.
# 1 replica + Recreate (PVC ReadWriteOnce). Credential lấy từ Secret
# compliance-engine-secrets (tạo bởi scripts/k8s-secrets.sh từ SSM).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compliance-postgres-data
  namespace: compliance
  labels:
    app.kubernetes.io/name: compliance-postgres
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-postgres
  namespace: compliance
  labels:
    app.kubernetes.io/name: compliance-postgres
    app.kubernetes.io/version: "16"
    app.kubernetes.io/part-of: idp-platform
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: compliance-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compliance-postgres
        app.kubernetes.io/version: "16"
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: compliance
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: compliance-engine-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: compliance-engine-secrets
                  key: postgres-password
            # Subdir tránh lỗi initdb do lost+found trên volume ext4 (EBS)
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d compliance -h 127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d compliance -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: compliance-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-postgres
  namespace: compliance
  labels:
    app.kubernetes.io/name: compliance-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: compliance-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
