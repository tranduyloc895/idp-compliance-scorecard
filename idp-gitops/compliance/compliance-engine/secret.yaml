# Secret manifest — values must be base64 encoded
# Create secrets manually or via External Secrets Operator:
#
#   kubectl create secret generic compliance-engine-secrets \
#     --from-literal=postgres-user=compliance \
#     --from-literal=postgres-password=<password> \
#     --from-literal=gemini-api-key=<api-key> \
#     -n compliance
#
# DO NOT commit actual secret values to Git.
apiVersion: v1
kind: Secret
metadata:
  name: compliance-engine-secrets
  namespace: compliance
  labels:
    app.kubernetes.io/name: compliance-engine
type: Opaque
data:
  postgres-user: Y29tcGxpYW5jZQ==       # "compliance" base64
  postgres-password: CHANGE_ME_BASE64   # Replace with actual base64-encoded password
  gemini-api-key: CHANGE_ME_BASE64      # Replace with actual Gemini API key base64
