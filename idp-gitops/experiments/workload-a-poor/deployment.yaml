# Workload A — POOR compliance target: ~45-55 score (🔴 Poor)
# Violations:
#   ❌ No runAsNonRoot (runs as root by default)
#   ❌ allowPrivilegeEscalation: true (default)
#   ❌ No readOnlyRootFilesystem
#   ❌ Capabilities not dropped
#   ❌ Image tag: latest (mutable)
#   ❌ No resource limits
#   ❌ No liveness/readiness probes
#   ❌ Missing required labels (version)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-a-poor
  namespace: compliance-test
  labels:
    app.kubernetes.io/name: workload-a-poor
    # ❌ Missing: app.kubernetes.io/version
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-a-poor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-a-poor
    spec:
      # ❌ No securityContext at pod level
      containers:
        - name: app
          image: nginx:latest    # ❌ :latest tag
          # ❌ No securityContext (runs as root, allows privilege escalation)
          # ❌ No resources.limits
          # ❌ No readinessProbe or livenessProbe
          ports:
            - containerPort: 80
