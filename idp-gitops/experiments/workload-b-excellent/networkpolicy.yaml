apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workload-b-excellent-netpol
  namespace: compliance-test
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: workload-b-excellent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: compliance-test
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
