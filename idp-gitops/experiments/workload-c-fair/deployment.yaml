# Workload C — FAIR compliance target: ~60-70 score (🟡 Fair)
# Mixed compliance:
#   ✅ runAsNonRoot: true
#   ❌ No readOnlyRootFilesystem
#   ✅ Resource limits set
#   ❌ Image: nginx-unprivileged:1.24.0 (bản cũ, có CVE — Trivy sẽ phát hiện)
#   ✅ Liveness + readiness probes set
#   ❌ Missing some labels (version missing)
#   ✅ allowPrivilegeEscalation: false
#   ❌ Capabilities not explicitly dropped
#
# Dùng nginx-unprivileged (listen 8080, UID 101): nginx thường chạy non-root sẽ
# không bind được port 80 và không chown được /var/cache/nginx -> Pod không Ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-c-fair
  namespace: compliance-test
  labels:
    app.kubernetes.io/name: workload-c-fair
    # ❌ Missing: app.kubernetes.io/version
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-c-fair
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-c-fair
    spec:
      securityContext:
        runAsNonRoot: true      # ✅
        runAsUser: 101
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.24.0   # ❌ Known CVEs (intentional for Trivy detection)
          securityContext:
            allowPrivilegeEscalation: false  # ✅
            # ❌ No readOnlyRootFilesystem
            # ❌ No capabilities.drop
          resources:                          # ✅ Resource limits
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:                     # ✅ Probes set
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          ports:
            - containerPort: 8080
