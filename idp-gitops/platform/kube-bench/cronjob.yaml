apiVersion: batch/v1
kind: CronJob
metadata:
  name: kube-bench
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-bench
    app.kubernetes.io/part-of: idp-platform
spec:
  schedule: "0 */1 * * *"    # Every hour
  concurrencyPolicy: Replace   # Cancel previous job if still running
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kube-bench
        spec:
          serviceAccountName: kube-bench
          hostPID: true           # Required to inspect host processes
          restartPolicy: Never
          containers:
            - name: kube-bench
              image: aquasec/kube-bench:v0.8.0
              command:
                - /bin/sh
                - -c
                - |
                  kube-bench run --json 2>/dev/null | \
                  kubectl create configmap kube-bench-results \
                    --from-literal=results.json="$(cat /dev/stdin)" \
                    -n monitoring \
                    --dry-run=client -o yaml | \
                  kubectl apply -f -
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: var-lib-etcd
                  mountPath: /var/lib/etcd
                  readOnly: true
                - name: var-lib-kubelet
                  mountPath: /var/lib/kubelet
                  readOnly: true
                - name: etc-systemd
                  mountPath: /etc/systemd
                  readOnly: true
                - name: etc-kubernetes
                  mountPath: /etc/kubernetes
                  readOnly: true
                - name: usr-bin
                  mountPath: /usr/local/mount-from-host/bin
                  readOnly: true
          volumes:
            - name: var-lib-etcd
              hostPath:
                path: /var/lib/etcd
            - name: var-lib-kubelet
              hostPath:
                path: /var/lib/kubelet
            - name: etc-systemd
              hostPath:
                path: /etc/systemd
            - name: etc-kubernetes
              hostPath:
                path: /etc/kubernetes
            - name: usr-bin
              hostPath:
                path: /usr/bin
