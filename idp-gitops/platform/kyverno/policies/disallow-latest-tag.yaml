apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Image Tag
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The ':latest' image tag is mutable and unpredictable. Require specific version tags.
      CIS Kubernetes Benchmark 5.4.1.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    # Dạng pattern (không dùng foreach) để Kyverno autogen được rule cho
    # Deployment/StatefulSet... ("autogen-*"); foreach trên request.object.spec
    # không được autogen nên kyverno test với Deployment không có kết quả.
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "An image tag is required. Specify a fixed version tag for reproducible deployments."
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Container uses ':latest' image tag. Specify a fixed version tag for reproducible deployments."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
