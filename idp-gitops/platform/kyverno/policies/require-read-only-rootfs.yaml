apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-read-only-rootfs
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Workload Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Container root filesystems must be mounted read-only.
      CIS Kubernetes Benchmark 5.2.4.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: read-only-rootfs
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Container must have readOnlyRootFilesystem: true. Mount writable paths as emptyDir volumes."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: "true"
