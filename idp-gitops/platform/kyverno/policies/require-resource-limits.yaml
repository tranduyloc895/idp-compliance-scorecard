apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require CPU and Memory Limits
    policies.kyverno.io/category: Platform Config
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Resource limits for CPU and memory must be set on all containers.
      Without limits, a pod can starve other pods. CIS Kubernetes Benchmark 5.2.11.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: resource-limits-required
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Container must have CPU and memory limits. Set resources.limits.cpu and resources.limits.memory."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
