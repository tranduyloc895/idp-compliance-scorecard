replicaCount: 1

admissionController:
  replicas: 1

backgroundController:
  enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

reportsController:
  enabled: true   # Generates PolicyReport CRDs — required by Compliance Engine

cleanupController:
  enabled: true

features:
  policyExceptions:
    enabled: true  # Allow per-namespace exceptions

grafana:
  enabled: false   # Disable — using Backstage for monitoring

# Chart 3.x: crds.groups.<group> là map từng CRD (mặc định bật hết, gồm
# wgpolicyk8s.io PolicyReport). Không ghi đè bằng boolean — chart lỗi render.
crds:
  install: true
