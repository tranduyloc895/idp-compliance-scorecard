# ──────────────────────────────────────────────────────────────────────────────
# CI Pipeline — checkout (Node.js / NestJS / Yarn)
#
# Trigger : push vào src/checkout/** (branch main) hoặc chạy thủ công
# Build   : Docker multi-stage (node:20-alpine builder)
# Scan    : Trivy — FAIL nếu có lỗ hổng CRITICAL
# Push    : ECR us-east-1 → retail-store/checkout:<sha7>
# Deploy  : Update apps/checkout/values.yaml trong idp-gitops → ArgoCD tự sync
# ──────────────────────────────────────────────────────────────────────────────

name: "CI — checkout"

on:
  push:
    branches: [main]
    paths:
      - "src/checkout/**"
      - ".github/workflows/ci-checkout.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION:   us-east-1
  ECR_REPO:     retail-store/checkout
  SERVICE:      checkout
  GITOPS_REPO:  tranduyloc895/idp-gitops
  GITOPS_REF:   main

jobs:
  build-scan-push:
    name: "Build → Scan → Push → GitOps"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Yarn install nặng — GHA cache + .yarn cache trong Dockerfile tiết kiệm thời gian
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context:   src/${{ env.SERVICE }}
          push:      false
          load:      true
          tags:      ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to:   type=gha,scope=${{ env.SERVICE }},mode=max

      - name: "Trivy scan (table — fail on CRITICAL)"
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref:      ${{ steps.meta.outputs.image }}
          format:         table
          severity:       CRITICAL,HIGH
          exit-code:      "1"
          ignore-unfixed: true
          vuln-type:      "os,library"

      - name: "Trivy scan (SARIF — GitHub Security)"
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref:      ${{ steps.meta.outputs.image }}
          format:         sarif
          output:         trivy-results.sarif
          severity:       CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type:      "os,library"

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category:   trivy-${{ env.SERVICE }}

      - name: Push image to ECR
        run: docker push ${{ steps.meta.outputs.image }}

      - name: Update GitOps values.yaml
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          IMAGE_TAG:  ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/v4.44.2/yq_linux_amd64"
          chmod +x /usr/local/bin/yq

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"

          git clone \
            "https://x-access-token:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git" \
            /tmp/idp-gitops
          cd /tmp/idp-gitops
          git checkout ${GITOPS_REF}

          VALUES_FILE="apps/${SERVICE}/values.yaml"
          yq e ".image.tag = \"${IMAGE_TAG}\"" -i "${VALUES_FILE}"

          git add "${VALUES_FILE}"
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "ci(${SERVICE}): update image tag to ${IMAGE_TAG} [skip ci]"
            git push
          fi

      - name: Job Summary
        if: success()
        run: |
          echo "## ✅ CI Pipeline — ${SERVICE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ steps.meta.outputs.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ steps.meta.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **GitOps** | \`apps/${SERVICE}/values.yaml\` updated |" >> $GITHUB_STEP_SUMMARY
